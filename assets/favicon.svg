<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- No background plate: the calendar itself is the icon, so it sits on
       whatever surface it lands on.

       The dark mass is kept LOW on purpose. An earlier version used an 8px
       outline and a 24px header band, which at 16px merged into a solid dark
       square - measured at 30% dark coverage, and it read as a black blob in
       the tab strip. Thinner stroke, shallower band and a larger wordmark put
       most of the area back to white, which is what makes a favicon legible
       at the size it is actually used. -->
  <g>
    <rect x="39" y="12" width="7" height="18" rx="3.5" fill="#3f3f46"/>
    <rect x="82" y="12" width="7" height="18" rx="3.5" fill="#3f3f46"/>
    <rect x="10" y="22" width="108" height="94" rx="16" fill="#ffffff" stroke="#18181b" stroke-width="6"/>
    <path d="M13 40 A13 13 0 0 1 26 25 H102 A13 13 0 0 1 115 40 V44 H13 Z" fill="#18181b"/>
    <text x="64" y="98" text-anchor="middle" font-family="Oswald, Arial Narrow, Helvetica, Arial, sans-serif"
          font-weight="700" font-size="58" fill="#18181b">imc</text>
  </g>
</svg>
