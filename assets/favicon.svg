<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- No background plate. The calendar itself is the icon, so it sits on
       whatever surface it lands on: a browser tab, a bookmark bar, a phone
       home screen. That means it cannot rely on a dark square for contrast,
       hence the near-black outline and header band - a plain white body would
       vanish on a light tab strip. -->
  <g>
    <!-- hanging rings -->
    <rect x="38" y="10" width="8" height="20" rx="4" fill="#3f3f46"/>
    <rect x="82" y="10" width="8" height="20" rx="4" fill="#3f3f46"/>
    <!-- body -->
    <rect x="8" y="20" width="112" height="98" rx="18" fill="#ffffff" stroke="#18181b" stroke-width="8"/>
    <!-- header band, drawn as a path so only its top corners are rounded -->
    <path d="M12 38 A14 14 0 0 1 26 24 H102 A14 14 0 0 1 116 38 V48 H12 Z" fill="#18181b"/>
    <text x="64" y="97" text-anchor="middle" font-family="Oswald, Arial Narrow, Helvetica, sans-serif"
          font-weight="700" font-size="52" fill="#18181b">imc</text>
  </g>
</svg>
